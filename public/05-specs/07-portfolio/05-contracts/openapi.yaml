openapi: 3.1.0
info:
  title: OnePoint Portfolio API
  version: 1.0.0
  description: |
    Orion-managed AUM portfolio for the authenticated client household.
    All Portfolio data is Tier A (Salesforce). Not live Orion Connect.
    UI layout is out of contract scope (Figma).
servers:
  - url: https://{host}
    variables:
      host:
        default: api.example.onepoint.com
paths:
  /api/v1/portfolio/summary:
    get:
      tags: [Portfolio]
      summary: Portfolio summary for the active household
      description: |
        P-01. Total market value, optional YTD realized G/L when flagged.
        Does not include allocation (see GET /portfolio/allocation).
        403 when portfolio_enabled is false.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Summary (may represent empty portfolio).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/UpstreamError'
  /api/v1/portfolio/allocation:
    get:
      tags: [Portfolio]
      summary: Orion asset allocation (household or account)
      description: |
        P-02. portfolio_orion scope only. Salesforce is the only source.
        Returns by-category and by-class breakdowns for household (default)
        or a single managed account. Each dimension status is ready or
        unavailable.
      security:
        - bearerAuth: []
      parameters:
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [household, account]
            default: household
        - name: accountId
          in: query
          required: false
          description: Required when level=account.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Allocation breakdowns (may be empty / unavailable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationResponse'
        '400':
          description: level=account without accountId.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/portfolio/accounts:
    get:
      tags: [Portfolio]
      summary: List managed financial accounts
      description: P-03. Active Orion-managed accounts under parent household.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account list (may be empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/portfolio/accounts/{accountId}:
    get:
      tags: [Portfolio]
      summary: Account summary
      description: |
        P-04. Account identity and balance facts. Does not embed allocation,
        holdings, or performance series — use sibling paths.
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/portfolio/accounts/{accountId}/performance:
    get:
      tags: [Portfolio]
      summary: Account performance series / periods
      description: P-05. Salesforce performance series. Status is ready or unavailable.
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            enum: [1M, 3M, 6M, YTD, 1Y, 3Y]
            default: YTD
      responses:
        '200':
          description: Performance payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPerformanceResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/portfolio/accounts/{accountId}/holdings:
    get:
      tags: [Portfolio]
      summary: Account holdings list
      description: P-06. Salesforce holdings. Status is ready or unavailable.
      security:
        - bearerAuth: []
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          description: Optional name/symbol search filter.
          schema:
            type: string
      responses:
        '200':
          description: Holdings payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountHoldingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: portfolio_enabled false.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Unknown account for this household.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpstreamError:
      description: Salesforce sync unavailable and no cache.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        code:
          type: string
        message:
          type: string
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
        currency:
          type: string
          default: USD
    AllocationSlice:
      type: object
      required: [code, label, weightPct, marketValue]
      properties:
        code:
          type: string
          description: Stable taxonomy code (category or class).
        label:
          type: string
        weightPct:
          type: number
          description: Share of level total; 0–1.
        marketValue:
          $ref: '#/components/schemas/Money'
    AllocationDimension:
      type: object
      required: [dimension, status, dataAsOf]
      properties:
        dimension:
          type: string
          enum: [category, class]
        status:
          type: string
          enum: [ready, unavailable]
        dataAsOf:
          type: string
          format: date-time
        slices:
          type: array
          items:
            $ref: '#/components/schemas/AllocationSlice'
          description: Empty when status is not ready.
    AllocationResponse:
      type: object
      required: [scope, level, dataAsOf, byCategory, byClass]
      properties:
        scope:
          type: string
          enum: [portfolio_orion]
        level:
          type: string
          enum: [household, account]
        accountId:
          type: string
          format: uuid
          description: Present when level=account.
        dataAsOf:
          type: string
          format: date-time
        byCategory:
          $ref: '#/components/schemas/AllocationDimension'
        byClass:
          $ref: '#/components/schemas/AllocationDimension'
    PortfolioSummary:
      type: object
      required: [totalMarketValue, dataAsOf, empty]
      properties:
        totalMarketValue:
          $ref: '#/components/schemas/Money'
        dataAsOf:
          type: string
          format: date-time
        empty:
          type: boolean
        ytdRealizedGainLoss:
          $ref: '#/components/schemas/Money'
          description: Present only when flag and data allow.
    FinancialAccountSummary:
      type: object
      required:
        - id
        - displayName
        - marketValue
        - isManaged
        - dataAsOf
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        accountNumberMasked:
          type: string
        custodianName:
          type: string
        accountType:
          type: string
        marketValue:
          $ref: '#/components/schemas/Money'
        ytdReturnPct:
          type: number
        isManaged:
          type: boolean
        dataAsOf:
          type: string
          format: date-time
        sourceLabel:
          type: string
          example: Orion
    AccountListResponse:
      type: object
      required: [accounts, dataAsOf]
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/FinancialAccountSummary'
        dataAsOf:
          type: string
          format: date-time
    AccountSummary:
      type: object
      required: [account, dataAsOf]
      properties:
        account:
          $ref: '#/components/schemas/FinancialAccountSummary'
        ytdGainLoss:
          $ref: '#/components/schemas/Money'
        dataAsOf:
          type: string
          format: date-time
    Holding:
      type: object
      required: [id, name, marketValue]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        symbol:
          type: string
        quantity:
          type: number
        price:
          type: number
        marketValue:
          $ref: '#/components/schemas/Money'
        weightPct:
          type: number
          description: Share of account market value; 0–1.
        changePct:
          type: number
        categoryCode:
          type: string
          description: Orion asset category code when classified.
        classCode:
          type: string
          description: Orion asset class code when classified.
        isAlternative:
          type: boolean
    PerformancePoint:
      type: object
      required: [date, marketValue]
      properties:
        date:
          type: string
          format: date
        marketValue:
          $ref: '#/components/schemas/Money'
        returnPct:
          type: number
    AccountPerformanceResponse:
      type: object
      required: [accountId, status, timeframe, dataAsOf]
      properties:
        accountId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ready, unavailable]
        timeframe:
          type: string
          enum: [1M, 3M, 6M, YTD, 1Y, 3Y]
        series:
          type: array
          items:
            $ref: '#/components/schemas/PerformancePoint'
        dataAsOf:
          type: string
          format: date-time
    AccountHoldingsResponse:
      type: object
      required: [accountId, status, dataAsOf]
      properties:
        accountId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ready, unavailable]
        holdings:
          type: array
          items:
            $ref: '#/components/schemas/Holding'
        dataAsOf:
          type: string
          format: date-time
