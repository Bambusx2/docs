openapi: 3.1.0
info:
  title: OnePoint Identity API
  version: 1.0.0
  description: |
    Middleware contracts for OnePoint Users and Identity. Client endpoints use an
    Okta-issued JWT. Salesforce-to-middleware actions accept either the
    `sfServiceAuth` bearer credential or the `sfWebhookApiKey` credential.
    Authentication failures MUST use an opaque message and must not disclose
    whether a user, account, invitation, or portal mapping exists.
servers:
  - url: https://{host}
    description: Placeholder middleware endpoint
    variables:
      host:
        default: api.example.onepoint.com
paths:
  /api/v1/invites:
    post:
      tags: [Salesforce actions]
      summary: Create a client invitation
      description: |
        Creates an invitation and begins identity/household provisioning. A-01:
        at most one successful create per Person Account in five minutes.
        Responses may include standard rate-limit headers.
      security:
        - sfServiceAuth: []
        - sfWebhookApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      responses:
        '202':
          $ref: '#/components/responses/InviteAccepted'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/invites/{inviteId}/resend:
    post:
      tags: [Salesforce actions]
      summary: Resend a client invitation
      description: |
        A-02: successful resends are limited to one per 60 seconds and three in
        a rolling 24-hour period. Responses may include standard rate-limit headers.
      security:
        - sfServiceAuth: []
        - sfWebhookApiKey: []
      parameters:
        - $ref: '#/components/parameters/InviteId'
      responses:
        '202':
          $ref: '#/components/responses/InviteAccepted'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/invites/{inviteId}/cancel:
    post:
      tags: [Salesforce actions]
      summary: Cancel a pending invitation
      security:
        - sfServiceAuth: []
        - sfWebhookApiKey: []
      parameters:
        - $ref: '#/components/parameters/InviteId'
      responses:
        '200':
          $ref: '#/components/responses/InviteAccepted'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/portal/enable:
    post:
      tags: [Salesforce actions]
      summary: Enable client portal access
      security:
        - sfServiceAuth: []
        - sfWebhookApiKey: []
      requestBody:
        $ref: '#/components/requestBodies/PortalAction'
      responses:
        '200':
          $ref: '#/components/responses/PortalAction'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/portal/disable:
    post:
      tags: [Salesforce actions]
      summary: Disable portal access and revoke all sessions
      security:
        - sfServiceAuth: []
        - sfWebhookApiKey: []
      requestBody:
        $ref: '#/components/requestBodies/PortalAction'
      responses:
        '200':
          $ref: '#/components/responses/PortalAction'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/portal/remove:
    post:
      tags: [Salesforce actions]
      summary: Remove portal access and revoke all sessions
      security:
        - sfServiceAuth: []
        - sfWebhookApiKey: []
      requestBody:
        $ref: '#/components/requestBodies/PortalAction'
      responses:
        '200':
          $ref: '#/components/responses/PortalAction'
        '404':
          $ref: '#/components/responses/Error'
  /api/v1/portal/reset-password:
    post:
      tags: [Salesforce actions]
      summary: Start an advisor password reset
      description: |
        A-05: successful reset requests are limited to three per Person Account
        in a rolling 24-hour period. Responses may include standard rate-limit headers.
      security:
        - sfServiceAuth: []
        - sfWebhookApiKey: []
      requestBody:
        $ref: '#/components/requestBodies/PortalAction'
      responses:
        '202':
          $ref: '#/components/responses/PortalAction'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/me:
    get:
      tags: [Client]
      summary: Get the authenticated client graph and readiness
      description: |
        A ready value of false indicates provisioning is still in progress; the
        mobile app polls this endpoint every three seconds for up to 120 seconds.
        A 401 always contains an opaque generic authentication message.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Client context, including provisioning readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/OpaqueAuthenticationError'
  /api/v1/auth/logout:
    post:
      tags: [Client]
      summary: Log out the current device
      description: Revokes only the current device's refresh token.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Local logout may proceed even if token revocation is unavailable.
        '401':
          $ref: '#/components/responses/OpaqueAuthenticationError'
  /api/v1/profile:
    get:
      tags: [Client]
      summary: Read the authenticated client's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile data sourced from the synchronized CRM record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/OpaqueAuthenticationError'
    patch:
      tags: [Client]
      summary: Validate an editable profile draft
      description: Does not modify Salesforce; submit a validated draft as a proposal.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        '200':
          description: Validated draft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/OpaqueAuthenticationError'
  /api/v1/profile/proposals:
    post:
      tags: [Client]
      summary: Submit profile changes for staff review
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileProposal'
      responses:
        '201':
          description: Proposal submitted; an existing pending proposal may be superseded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileProposal'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/OpaqueAuthenticationError'
  /api/v1/legal/accept:
    post:
      tags: [Client]
      summary: Accept current Terms and Privacy Policy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegalAcceptRequest'
      responses:
        '204':
          description: Both current legal documents were accepted.
        '409':
          description: Submitted versions are stale; body provides the current versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/OpaqueAuthenticationError'
  /api/v1/admin/impersonation/start:
    post:
      tags: [Administration]
      summary: Start impersonating an active client
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sfPersonAccountId]
              properties:
                sfPersonAccountId:
                  type: string
      responses:
        '201':
          description: Impersonation session started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpersonationSession'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/admin/impersonation/end:
    post:
      tags: [Administration]
      summary: End the active impersonation session
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Admin context restored; no active session is a no-op.
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/admin/impersonation:
    get:
      tags: [Administration]
      summary: List impersonation audit history
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Audit sessions, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImpersonationSession'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/ops/sync-failures:
    get:
      tags: [Operations]
      summary: List failed identity and provisioning sync jobs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Failed jobs; the list may be empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SyncJob'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/ops/sync-in-progress:
    get:
      tags: [Operations]
      summary: List in-progress identity and provisioning sync jobs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: In-progress jobs; the list may be empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SyncJob'
        '403':
          $ref: '#/components/responses/Error'
  /api/v1/ops/invite-funnel:
    get:
      tags: [Operations]
      summary: Get invite funnel counts and conversion rates
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Middleware-calculated trailing seven- and thirty-day metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteFunnel'
        '403':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Okta JWT used by the React Native client and privileged users.
    sfServiceAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Salesforce-to-middleware service bearer credential.
    sfWebhookApiKey:
      type: apiKey
      in: header
      name: X-SF-Service-Key
      description: Alternative Salesforce-to-middleware webhook credential.
  parameters:
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
  headers:
    RateLimitLimit:
      description: Maximum successful actions permitted in the applicable window.
      schema:
        type: integer
    RateLimitRemaining:
      description: Remaining successful actions in the applicable window.
      schema:
        type: integer
    RateLimitReset:
      description: Unix timestamp when the applicable rate-limit window resets.
      schema:
        type: integer
    RetryAfter:
      description: Seconds until the action may be retried.
      schema:
        type: integer
  requestBodies:
    PortalAction:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PortalActionRequest'
  responses:
    Error:
      description: Request failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OpaqueAuthenticationError:
      description: Authentication failed. Message is opaque to prevent account enumeration.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: authentication_failed
            message: Authentication failed.
    RateLimited:
      description: Successful-action rate limit exceeded.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InviteAccepted:
      description: Invitation action accepted or completed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Invite'
    PortalAction:
      description: Portal action completed or accepted.
      content:
        application/json:
          schema:
            type: object
            required: [sfPersonAccountId, mobileStatus]
            properties:
              sfPersonAccountId:
                type: string
              mobileStatus:
                $ref: '#/components/schemas/Mobile_Status'
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: Safe client-facing message; authentication messages are opaque.
    Mobile_Status:
      type: string
      enum: [not_invited, invited, active, disabled, removed]
    InviteStatus:
      type: string
      enum: [not_invited, pending, syncing, sent, accepted, failed, cancelled]
    InviteRequest:
      type: object
      required: [sfPersonAccountId]
      properties:
        sfPersonAccountId:
          type: string
          description: Salesforce Person Account identifier.
        actorSfUserId:
          type: string
          description: Salesforce advisor initiating the action.
    Invite:
      type: object
      required: [id, sfPersonAccountId, status]
      properties:
        id:
          type: string
        sfPersonAccountId:
          type: string
        status:
          $ref: '#/components/schemas/InviteStatus'
        mobileStatus:
          $ref: '#/components/schemas/Mobile_Status'
        lastResentAt:
          type: string
          format: date-time
    PortalActionRequest:
      type: object
      required: [sfPersonAccountId]
      properties:
        sfPersonAccountId:
          type: string
        actorSfUserId:
          type: string
    MeResponse:
      type: object
      required: [ready, user, household, flags, legalAcceptanceNeeded]
      properties:
        ready:
          type: boolean
        user:
          type: object
          required: [id, sfPersonAccountId, mobileStatus]
          properties:
            id:
              type: string
            sfPersonAccountId:
              type: string
            displayName:
              type: string
            mobileStatus:
              $ref: '#/components/schemas/Mobile_Status'
        household:
          type: object
          description: Authenticated Person Account-scoped household graph.
          additionalProperties: true
        flags:
          type: object
          additionalProperties:
            type: boolean
        legalAcceptanceNeeded:
          type: boolean
    Profile:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        dateOfBirth:
          type: string
          format: date
        occupation:
          type: string
        employer:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        address:
          type: object
          properties:
            street:
              type: string
            city:
              type: string
            state:
              type: string
            postalCode:
              type: string
        suitability:
          type: object
          additionalProperties: true
        ssnLast4:
          type: string
          pattern: '^\d{4}$'
          description: Last four digits only; full SSN/TIN is never returned or accepted.
    ProfileProposal:
      type: object
      required: [fieldDiffs]
      properties:
        id:
          type: string
          readOnly: true
        status:
          type: string
          enum: [pending, approved, rejected, superseded]
          readOnly: true
        fieldDiffs:
          type: object
          additionalProperties: true
        submittedAt:
          type: string
          format: date-time
          readOnly: true
    LegalAcceptRequest:
      type: object
      required: [termsVersion, privacyVersion]
      properties:
        termsVersion:
          type: string
        privacyVersion:
          type: string
    ImpersonationSession:
      type: object
      required: [id, adminId, clientId, startedAt]
      properties:
        id:
          type: string
        adminId:
          type: string
        clientId:
          type: string
        sfPersonAccountId:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
    SyncJob:
      type: object
      required: [id, status, startedAt]
      properties:
        id:
          type: string
        sfPersonAccountId:
          type: string
        status:
          type: string
          enum: [pending, syncing, failed]
        startedAt:
          type: string
          format: date-time
        error:
          type: string
        correlationId:
          type: string
    InviteFunnel:
      type: object
      required: [calculatedAt, trailing7Days, trailing30Days]
      properties:
        calculatedAt:
          type: string
          format: date-time
        trailing7Days:
          $ref: '#/components/schemas/InviteFunnelPeriod'
        trailing30Days:
          $ref: '#/components/schemas/InviteFunnelPeriod'
    InviteFunnelPeriod:
      type: object
      required: [invited, sent, accepted, firstLogin, failed]
      properties:
        invited:
          type: integer
          minimum: 0
        sent:
          type: integer
          minimum: 0
        accepted:
          type: integer
          minimum: 0
        firstLogin:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        acceptanceRate:
          type: number
          format: float
        firstLoginRate:
          type: number
          format: float
